# conda-recipe/meta.yaml
#
# Notes on building the conda package for VACUUMMS from source directory. 
#
# VACUUMMS will build from either the modules on an HPC cluster or 
# from a suitable conda environment, which means using the compiler, etc. 
# in that environment. The latter is used here.
#
# Building VACUUMMS:
#
#   From modules:
#     module load gcc cuda libtiff python/3.13 ...
#
#   From conda environment:
#     mamba create -n vacuumms gcc=12 python=3.13 cuda=12 pybind11 xorg-libx11 xorg-xproto cmake numpy libtiff ipykernel
#     mamba activate vacuumms
#
#  Then:
#     mkdir VACUUMMS/build
#     cd VACUUMMS/build
#     export PREFIX=/usr/local/vacuumms # or wherever you want it installed.
#
#     cmake .. -DPython3_EXECUTABLE=$(which python3) \
#              -DCMAKE_INSTALL_PREFIX=${PREFIX}      \
#              -DBUILD_CUDA_COMPONENTS=Y             \
#              -DBUILD_TIFF_UTILS=Y                  \
#              -DBUILD_PYTHON_BINDINGS=Y
#     make -j4 install
#
#
# Building the conda package:
#
##   mamba create -n build-env
##   mamba activate build-env
#   mamba install -c conda-forge conda-build
#   cd conda-recipe
#   conda build .
#
# The build environment must include conda-build. Note that when testing install from a local channel, 
# the channel must first be indexed, in order to make the package discoverable, e.g.:
#
#   conda index ~/miniforge3/conda-bld/linux-64/
#   mamba create -n install-env
#   mamba activate install-env
#   mamba install -c local vacuumms
# 
# The package itself is either a tarball vacuumms-<version>-<build_string>.tar.bz2
# or a conda archive vacuumms-<version>-<build_string>.conda depending on which version
# of conda-build is used.
#
# Note the value for source:path below can be replaced with a github address.
#
# Some other things to consider if things don't go smoothly: 
#
#   conda clean --all
#   
# If the build environment or install environment are corrupted, it's best to remove them and start fresh.
# On some HPC systems, building script runs best on a compute node. YMMV. 
#
# Installation of the package can also be accomplished standalone from the github site:
# 
#   mamba install https://raw.githubusercontent.com/frankwillmore/VACUUMMS/scene/channel/linux-64/vacuumms-1.2.1-py313h2bc3f7f_0.conda 
#
# To run VACUUMMS from a Jupyter kernel:
#
#    conda activate vacuumms
#    python -m ipykernel install --user --name vacuumms --display-name "VACUUMMS Jupyter kernel"
# 
# Then start a Jupyter server and notebook using this kernel. Note that it may be a necessary workaround to put 
# the directory with shared object vacuumms.cpython-313-aarch64-linux-gnu.so in the PYTHONPATH for vacuumms 
# to be visible/importable. The vacuumms classes need to be visible to the server.
#
#   export PYTHONPATH=/home/frankwillmore/vacuumms/lib
#   jupyter server
#
# Make sure the jupyter server is configured: 
# cat ~/.jupyter/jupyter_notebook_config.py 
# c.ServerApp.ip = '0.0.0.0'  # Allow connections from outside the VM
# c.ServerApp.allow_remote_access = True
# c.ServerApp.token = ''
#
# Connect to the server by pointing browser to http://192.168.254.124:8888/tree (IP will differ)
#

package:
  name: vacuumms
  version: 1.2.1

source:
  path: ../

build:
  number: 0
# Select an appropriate platform, based on the processor (x86 or ARM)
#  target_platform: linux-64
  target_platform: linux-aarch64
  script:
# Include or exclude cuda, based on whether driver and GPU are available
#    - cmake . -DCMAKE_INSTALL_PREFIX=${PREFIX} -DBUILD_CUDA_COMPONENTS=Y -DBUILD_TIFF_UTILS=Y -DBUILD_PYTHON_BINDINGS=Y
    - cmake . -DCMAKE_INSTALL_PREFIX=${PREFIX} -DBUILD_CUDA_COMPONENTS=N -DBUILD_TIFF_UTILS=Y -DBUILD_PYTHON_BINDINGS=Y
    - make -j8 install
# Depending on architecture, soname will be different here.
#    - cp pybind/vacuumms.cpython-313-x86_64-linux-gnu.so $SP_DIR
    - cp pybind/vacuumms.cpython-313-aarch64-linux-gnu.so $SP_DIR
    - cp libraries/libvacuumms_rt.so $PREFIX/lib/
    - cp libraries/libvacuumms_cpp.so $PREFIX/lib/
    - cp libraries/vacuumms_variational/libvacuumms_variational.so $PREFIX/lib/

  channels:
    - conda-forge

requirements:
  build:
    - cmake
    - make
    - {{ compiler('cxx') }}
    - python >=3.12
    - cuda
#    - xorg-libx11=1.8.7 <-- pinning this version solved missing includes but broke build flexibility. <X11/X.h> may be provided by xorg-xproto
    - xorg-libx11
    - xorg-xproto
    - libtiff
    - pybind11
    - numpy
  host:
    - python >=3.12
    - cuda
    - xorg-libx11
    - libtiff
    - pybind11
    - numpy
  run:
    - python >=3.12
    - cuda
    - xorg-libx11
    - libtiff
    - pybind11
    - numpy

  test:
    commands:
      - python -c "import vacuumms; print(vacuumms.__version__)"

about:
  home: https://github.com/VACUUMMS/VACUUMMS
  license: MIT
  license_file: LICENSE.md
  summary: conda package for vacuumms
