{% set name = "vacuumms" %}
{% set version = "1.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

#source:
#  url: https://github.com/VACUUMMS/VACUUMMS 
#  sha256: 

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - pip
    - python
    - setuptools
  host:
    - python
    - pip
  run:
    - python
    - numpy
    - scipy

test:
  imports:
    - vacuumms
  commands:
    - pip check
  requires:
    - pip

about:
  home: UNKNOWN
  summary: Void Analysis Codes and Unix-like Utilities for Molecular Modeling and Simulation
  license: MIR
  license_file: LICENSE

extra:
  recipe-maintainers:
    - frankwillmore

